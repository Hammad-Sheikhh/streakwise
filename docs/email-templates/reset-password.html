<!--
  Supabase → Authentication → Emails → Templates → "Reset password".
  Subject: Reset your Streakwise password
  The link goes to our own /auth/confirm (SPEC ACCT-4), which opens /reset-password.
-->
<h2>Reset your Streakwise password</h2>
<p>Someone (hopefully you) asked to reset the password for this account.</p>
<p>
  <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    >Choose a new password</a
  >
</p>
<p>The link works once and expires soon. If you didn't ask for this, you can ignore this email.</p>
