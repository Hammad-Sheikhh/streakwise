[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build when only docs or Markdown changed, to save credits (SPEC §B14.1).
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "24"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  framework = "#custom"

# SPA fallback: every unknown path serves the app shell; React Router handles it.
# Functions with `config.path` (e.g. /api/*) take precedence over this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Shared reports are private: keep them out of search engines and never leak the slug via Referer.
[[headers]]
  for = "/r/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
