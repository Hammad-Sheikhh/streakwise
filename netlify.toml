[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build when only docs or Markdown changed, to save credits (SPEC §B14.1).
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "24"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  framework = "#custom"

# SPA fallback: every unknown path serves the app shell; React Router handles it.
# Functions with `config.path` (e.g. /api/*) take precedence over this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Response headers (CSP, security, caching) are not here: build/security-headers.ts writes them to
# dist/_headers only during builds on Netlify, so they never apply to the local dev server.
